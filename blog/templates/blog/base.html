<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #444;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
            min-height: 400px;
            background: white;
            margin: 20px;
            border-radius: 8px;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        h1, h2, h3 {
            margin-top: 0;
        }
        .form-container {
            background: #eee;
            padding: 20px;
            border-radius: 8px;
        }
        .form-container button {
            background: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .form-container button:hover {
            background: #555;
        }
        .resultados {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blog Académico</h1>
        <p></p>
    </header>
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'autor' %}">Nuevo Autor</a>
        <a href="{% url 'post' %}">Nuevo Post</a>
        <a href="{% url 'comentario' %}">Nuevo Comentario</a>
        <a href="{% url 'buscar_post' %}">Buscar Post</a>
    </nav>
    <main>
        {% block content %}
        
        {% endblock %}
    </main>
    <footer>
        <p>Proyecto académico - 2026</p>
    </footer>
</body>
</html>
