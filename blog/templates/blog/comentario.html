{% extends 'blog/base.html' %}

{% block title %}Nuevo Comentario{% endblock %}

{% block content %}
<h2>Formulario para crear Comentario</h2>
<div class="form-container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar Comentario</button>
    </form>
</div>
{% endblock %}
